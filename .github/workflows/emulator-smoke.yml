name: Android emulator smoke (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android 36 emulator and SDK 37
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" "platforms;android-36" "emulator" "system-images;android-36;default;x86_64"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Build app and run unit tests
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug
      - name: Run headless isolated Android 36 emulator
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/avdmanager' | sort -V | tail -1)"
          test -x "$AVDMANAGER"
          echo no | "$AVDMANAGER" create avd -n GoreeCloudGIFSmoke -k 'system-images;android-36;default;x86_64' --device 'pixel_5' --force
          printf '\nhw.ramSize=1536M\ndisk.dataPartition.size=2048M\nsdcard.size=128 MB\n' >> "$HOME/.android/avd/GoreeCloudGIFSmoke.avd/config.ini"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          "$SDK_ROOT/emulator/emulator" -avd GoreeCloudGIFSmoke -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 1536 -port 5580 > "$RUNNER_TEMP/gif-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          trap 'adb -s emulator-5580 emu kill >/dev/null 2>&1 || true; kill "$EMULATOR_PID" >/dev/null 2>&1 || true' EXIT
          python3 scripts/android-emulator-smoke.py --serial emulator-5580 --apk app/build/outputs/apk/debug/app-debug.apk
      - name: Upload emulator log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-startup-log
          path: ${{ runner.temp }}/gif-emulator.log
          if-no-files-found: ignore
          retention-days: 3
