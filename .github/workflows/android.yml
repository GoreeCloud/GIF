name: Android
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    name: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          # Reuse dependencies when Gradle repositories have transient failures.
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle/wrapper/gradle-wrapper.properties
      - name: Install Android SDK 37.1 with hosted runner tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --licenses < <(yes) >/dev/null
          "$SDKMANAGER" "platforms;android-37.1" "build-tools;36.0.0"
      - name: Test emulator smoke harness
        run: |
          python3 -m py_compile scripts/android-emulator-smoke.py
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate unit tests, Android lint and APK build
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Record APK SHA-256 checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS
          cat SHA256SUMS
      - name: Upload experimental debug APK
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-gifs-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
